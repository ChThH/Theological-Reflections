title: Theological Reflections
remote_theme: jekyll/minima
github_username: ChThH
minima:
  skin: solarized
  social_links:
    - { platform: github,  user_url: "https://github.com/ChThH" }
#author:
  #name: Christopher Hall
  #email: "chthh@example.com"
plugins:
- jekyll-remote-theme # add this line to the plugins list if you already have one
- jekyll-optional-front-matter
header_pages: 
  - index.md
  - teaching-series.md
  - reflections.md
include:
  - "*/*.md"
  - "/publish/**/*.md"
collections:
  articles_on_feasts:
    output: true
    permalink: /Articles-on-Feasts/:name/
markdown_ext: "markdown,mkdown,mkdn,mkd,md"